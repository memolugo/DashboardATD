<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard · Afiliación a Servicios de Salud</title>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- Tabulator -->
  <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
  <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root{
      --verde-oscuro:#2E3B2B;
      --verde-olivo:#71785b;
      --dorado:#bc9b73;
      --vino:#773357;
      --cafe:#7C4A36;
      --gris-suave:#CBCABE;
      --fondo:#F8F9FB;
      --borde:#E6E6E6;
    }
    body{ font-family:'Montserrat',sans-serif; background:var(--fondo); color:#1f2937; }
    .card{ background:#fff; border-radius:1.25rem; box-shadow:0 10px 25px rgba(0,0,0,.06); border:1px solid var(--borde); }
    .section-title{ color:var(--verde-oscuro); font-weight:600; letter-spacing:.2px; }
    .header-grad{ background:linear-gradient(90deg,var(--verde-oscuro),var(--verde-olivo)); }
    .logo-img{ height:60px; width:auto; object-fit:contain; filter:drop-shadow(0 2px 2px rgba(0,0,0,.15)); }
    .menu-btn{
      background-color:var(--verde-olivo);
      color:white;
      font-weight:600;
      padding:.6rem 1.2rem;
      border-radius:9999px;
      transition:.3s;
    }
    .menu-btn:hover{ background-color:var(--vino); transform:translateY(-2px); }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="w-full header-grad text-white py-4 px-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <img src="https://rawcdn.githack.com/memolugo/DashboardATD/bdc774c87976d9e8341f893659634dfc1ff36e51/ATD%205.png"
             alt="ATD · Gobierno del Estado de Morelos" class="logo-img" />
        <h1 class="text-2xl font-bold tracking-tight">Afiliación a Servicios de Salud</h1>
      </div>
      <span class="text-xs bg-white/10 px-3 py-1 rounded-full">Fuente: INEGI 2020</span>
    </div>
  </header>

  <!-- MENÚ DE BOTONES -->
  <nav class="w-full bg-white shadow-sm py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-center gap-2 px-4">
      <a href="demografico_poblacion.html" class="menu-btn">Población</a>
      <a href="demografico_educacion.html" class="menu-btn">Educación</a>
      <a href="demografico_economia.html" class="menu-btn">Economía</a>
      <a href="demografico_salud.html" class="menu-btn">Salud</a>

      <a href="demografico_diversidad.html" class="menu-btn">Diversidad Cultural</a>
      <a href="demografico_limitaciones.html" class="menu-btn">Limitaciones y Discapacidades</a>
      <a href="demografico.html" class="menu-btn">Inicio</a>
    </div>
  </nav>
