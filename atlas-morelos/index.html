<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Morelos - Transformación Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0efeb;
            margin: 0;
            padding: 0;
            color: #2E3B2B;
            overflow-x: hidden;
        }
        :root {
            --sidebar-bg: #F2F1E8;
            --badge-bg: #6D745E;
            --item-active-bg: #E0E5C1;
            --text-main: #2E3B2B;
            --accent-maroon: #8c3154;
        }
        
        .border-pattern {
            height: 24px;
            background-image: url('https://rawcdn.githack.com/memolugo/DashboardATD/main/Cenefa.png');
            background-repeat: repeat-x;
            background-size: auto 100%;
            width: 100%;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        @keyframes pulse-ring {
          0% { transform: scale(.33); }
          80%, 100% { opacity: 0; }
        }
        .selected-marker-pulse::before {
          content: '';
          position: absolute;
          width: 200%;
          height: 200%;
          background-color: var(--accent-maroon);
          border-radius: 50%;
          animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
          z-index: -1;
        }

        .leaflet-container {
            width: 100%;
            height: 100%;
            background: #f4f3f0;
            outline: none;
        }
        .atlas-popup .leaflet-popup-content-wrapper {
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .sidebar-category-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
        }
        .sidebar-item-text {
            font-size: 11px;
            font-weight: 400;
            color: #555;
            line-height: 1.3;
        }
        .sidebar-item-active {
            font-weight: 700;
            color: var(--text-main);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "leaflet": "https://esm.sh/leaflet@^1.9.4",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
