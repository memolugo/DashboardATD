name: Deploy atlas-morelos to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "atlas-morelos/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

     - name: Setup Node
  uses: actions/setup-node@v4
  with:
    node-version: 20


      - name: Install dependencies
        working-directory: atlas-morelos
        run: npm ci

      - name: Build
        working-directory: atlas-morelos
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: atlas-morelos/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
